# Refresh the prices and republish the slides to GitHub Pages (gh-pages).
name: Publish slides

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 1 * *"   # first day of every month, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::quantmod
            any::forecast
            any::ggplot2
            any::plotly
            any::scales
            any::knitr
            any::rmarkdown

      - name: Download the latest prices
        run: Rscript scripts/update_data.R

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
